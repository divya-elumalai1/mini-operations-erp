services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mini_erp_dev}
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d ${DB_NAME:-mini_erp_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
