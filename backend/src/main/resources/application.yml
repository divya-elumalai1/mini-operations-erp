spring:
  application:
    name: mini-erp-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mini_erp_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

minierp:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-min-32-bytes-long!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.minierp: INFO
